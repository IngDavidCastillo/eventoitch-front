<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/logo-icono.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventoITCH</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Aplica el modo claro u oscuro antes de pintar (ver src/utils/tema.js) -->
    <script>
      try {
        var t = localStorage.getItem('eventoitch-tema');
        if (t !== 'oscuro' && t !== 'claro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
        document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
    <!-- Fuentes del diseno de Stitch: Plus Jakarta Sans (titulos), Inter (texto), JetBrains Mono (folios) e iconos Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
